<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Личный кабинет · Ситифермерство</title>
  <meta name="description" content="Личный кабинет участника: профиль, загрузка фотографий наблюдений за растениями и ваши публикации.">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/cormorant-garamond-cyrillic-500-italic.woff2" as="font" type="font/woff2" crossorigin>
  <script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}})()</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="site-header" id="site-header"></header>
  <script src="/js/icons.js"></script>
  <script src="/js/site-data.js"></script>
  <script src="/js/header.js"></script>

  <main id="main">
    <div id="cabinet-root">
      <div class="auth container">
        <div class="panel glass" style="min-height:420px;display:grid;place-items:center">
          <span class="spinner" style="color:var(--text-3)"></span>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/cabinet.js"></script>

</html>
